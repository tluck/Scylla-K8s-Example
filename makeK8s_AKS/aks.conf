export clusterName="${1:-tjl-scylla}"
export resourceGroup="${clusterName}-rg"
export region="${azRegion:-westus3}"
export zone="1"

# the actual names for clusters and zones are set in init.conf
machineType0="Standard_D4s_v5"  # general operator and other services
machineType1="Standard_L8as_v4" # Local NVMe SSD based machines for ScyllaDB
machineType2="Standard_D8ps_v6" # arm64 application nodes
# Standard_D4s_v5   4 vCPU x 16 GB
# Standard_D8s_v5   8 vCPU x 32 GB
# Standard_L8as_v4  8 vCPU x 64 GB, 4 x 457,728 MiB NVMe (AMD); Standard_L8s_v4 is Intel
# Standard_L8as_v4 has only an NVMe disk controller - the OS disk is also /dev/nvme*
osSku="Ubuntu" # "AzureLinux"
rootDiskSize=100
tags="owner=sa_demo_scylladb_com"

# AKS node counts are per pool; zones spread them (1 per zone with 3 zones)
if [[ ${singleZone} == true ]]; then
    zones="${zone}"
else
    zones="1 2 3"
fi
nodesPer0=3
nodesPer1=3
nodesPer2=1
