# Helm values for the scylla/scylla-manager chart. Kept in sync with templateManager.yaml so that
# helmEnabled=true and helmEnabled=false produce the same Manager - edit both together.
# The chart has no hook for extra volumes on the Manager Deployment, so the mTLS client-cert
# mount (#CUSTC in templateManager.yaml) is patched in by deployScylla.bash after helm install.
nameOverride: ""
fullnameOverride: ""
image:
  repository: docker.io/scylladb
  pullPolicy: IfNotPresent
  tag: MANAGERVERSION # 3.5.0
# Scylla Manager log level, allowed values are: error, warn, info, debug, trace
logLevel: info
resources:
  requests: { cpu: 100m, memory: 200Mi }
  limits:   { cpu: MANAGERCPULIMIT, memory: MANAGERMEMORYLIMIT }
nodeSelector: {}
tolerations: []
affinity: {}
securityContext: {}
serviceAccount:
  create: true
  annotations: {}
  name: ""
# Manager's backing ScyllaCluster (subchart). The chart keeps its default annotation
# scylla-operator.scylladb.com/disable-global-scylladb-manager-integration: "true".
scylla:
  developerMode: DEVMODE
  scyllaImage:
    repository: docker.io/scylladb/scylla
    tag: DBVERSION
  agentImage:
    repository: docker.io/scylladb/scylla-manager-agent
    tag: AGENTVERSION
  #DEV sysctls:
  #DEV   - fs.aio-max-nr=30000000
  # pods are scylla-manager-DATACENTER-rack1-N, same as templateManager.yaml
  datacenter: DATACENTER
  racks:
    - name: rack1
      members: MANAGERMEMBERS # 1 or 3
      storage:
        capacity: MANAGERDBCAPACITY
        storageClassName: "STORAGECLASS"
      resources:
        requests: { cpu: MANAGERDBCPULIMIT, memory: MANAGERDBMEMORYLIMIT }
        limits:   { cpu: MANAGERDBCPULIMIT, memory: MANAGERDBMEMORYLIMIT }
      agentResources:      # For ScyllaDB Agent container
        requests: { cpu: "100m", memory: "100Mi" }
        limits:   { cpu: "100m", memory: "100Mi" }
      placement:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: scylla.scylladb.com/node-type
                    operator: In
                    values:
                      - NODESELECTOR
        tolerations:
          - effect: NoSchedule
            key: scylla-operator.scylladb.com/dedicated
            operator: Equal
            value: scyllaclusters
# deployScylla.bash creates the scylla-manager ServiceMonitor itself (a chart-owned one conflicts with it)
serviceMonitor:
  create: false
