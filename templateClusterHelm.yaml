      limits:   { cpu: "100m", memory: "100Mi" } 
    placement:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: scylla.scylladb.com/node-type
                  operator: In
                  values:
                    - NODESELECTOR
                #CLOUD - key: TOPOLOGYKEY
                #CLOUD   operator: In
                #CLOUD   values:
                #CLOUD   - ZONE2
      #PROD podAntiAffinity: 
      #PROD   preferredDuringSchedulingIgnoredDuringExecution:
      #PROD     - weight: 100
      #PROD       podAffinityTerm:
      #PROD         labelSelector:
      #PROD           matchLabels:
      #PROD             app: scylla
      #PROD         matchLabelKeys:
      #PROD           - scylla/datacenter
      #PROD         topologyKey: kubernetes.io/hostname
      tolerations:
        - effect: NoSchedule
          key: scylla-operator.scylladb.com/dedicated
          operator: Equal
          value: scyllaclusters
    #CTorG volumes:
    #CUSTC   - name: CLUSTERNAME-server-certs
    #CUSTC     secret:
    #CUSTC       secretName: CLUSTERNAME-server-certs
    #CUSTC       defaultMode: 420
    #CERTS   - name: scylladb-serving-ca
    #CERTS     configMap:
    #CERTS       name: CLUSTERNAME-local-serving-ca
    #CERTS       defaultMode: 420
    #EAR   - name: CLUSTERNAME-encryption-key
    #EAR     secret:
    #EAR       secretName: CLUSTERNAME-encryption-key
    #EAR       defaultMode: 420
    #GCS   - name: gcs-service-account
    #GCS     secret:
    #GCS       secretName: gcs-service-account
    #CTorG volumeMounts:
    #CUSTC   - name: CLUSTERNAME-server-certs
    #CUSTC     readOnly: true
    #CUSTC     mountPath: /var/run/secrets/scylla-server-certs/
    #CERTS   - name: scylladb-serving-ca
    #CERTS     readOnly: true
    #CERTS     mountPath: /var/run/configmaps/scylla-operator.scylladb.com/scylladb/serving-ca
    #EAR   - name: CLUSTERNAME-encryption-key
    #EAR     readOnly: true
    #EAR     mountPath: /etc/scylla/encryption_keys
    #GCS agentVolumeMounts:
    #GCS   - name: gcs-service-account
    #GCS     mountPath: /etc/scylla-manager-agent/gcs-service-account.json
    #GCS     subPath: gcs-service-account.json
    #GCS     readOnly: true
  - name: rack3
    members: MEMBERS
    scyllaConfig: CLUSTERNAME-config                  # scylla.yaml ConfigMap written by deployScylla.bash
    scyllaAgentConfig: CLUSTERNAME-agent-config-secret # agent config Secret written by deployScylla.bash
    storage:
      capacity: CAPACITY
      storageClassName: scylladb-local-xfs
    resources:
      requests: { cpu: CPULIMIT, memory: MEMORYLIMIT }
      limits:   { cpu: CPULIMIT, memory: MEMORYLIMIT }
    agentResources:      # For ScyllaDB Agent container
      requests: { cpu: "100m", memory: "100Mi" }
      limits:   { cpu: "100m", memory: "100Mi" } 
    placement:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: scylla.scylladb.com/node-type
                  operator: In
                  values:
                    - NODESELECTOR
                #CLOUD - key: TOPOLOGYKEY
                #CLOUD   operator: In
                #CLOUD   values:
                #CLOUD   - ZONE3
      #PROD podAntiAffinity: 
      #PROD   preferredDuringSchedulingIgnoredDuringExecution:
      #PROD     - weight: 100
      #PROD       podAffinityTerm:
      #PROD         labelSelector:
      #PROD           matchLabels:
      #PROD             app: scylla
      #PROD         matchLabelKeys:
      #PROD           - scylla/datacenter
      #PROD         topologyKey: kubernetes.io/hostname
      tolerations:
        - effect: NoSchedule
