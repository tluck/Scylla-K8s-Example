# Helm values for the scylla/scylla chart. Kept in sync with templateCluster.yaml so that
# helmEnabled=true and helmEnabled=false render the same ScyllaCluster spec - edit both together.
# The chart passes racks, exposeOptions and externalSeeds through to the CR verbatim.
nameOverride: ""
# CR name = clusterName (otherwise the chart derives it from the release name)
fullnameOverride: CLUSTERNAME
scyllaImage:
  repository: docker.io/scylladb/scylla
  tag: DBVERSION # 2026.2.1
agentImage:
  repository: docker.io/scylladb/scylla-manager-agent
  tag: AGENTVERSION # 3.11.1
serviceAccount:
  create: true
  annotations: {}
#ALT alternator:
#ALT   enabled: true
#ALT   port: 8000
#ALT   writeIsolation: WRITEISOLATION
#ALT   insecureEnableHTTP: null # drop the chart default so the spec matches templateCluster.yaml
developerMode: DEVMODE
automaticOrphanedNodeCleanup: true
scyllaArgs: "--smp=CPULIMIT" # "--poll-mode"
#BAK backups:
#BAK   - name: daily
#BAK     location: [BACKUPLOCATION]
#BAK     cron: "0 1 * * *" # Every day at 01:00
#BAK     retention: 14     # Keep 14 days of backups
#GCS backups:
#GCS   - name: daily
#GCS     location: [gcs:GCSBUCKETNAME]
#GCS     cron: "0 1 * * *" # Every day at 01:00
#GCS     retention: 14     # Keep 14 days of backups
repairs:
  - name: weekly
    cron: "0 0 * * 0" # Every Sunday at midnight
    dc: ["DATACENTER"] # Specify the datacenter to run the repair in
    keyspace: ["*"]  # All keyspaces
    # intensity: 0
    # parallel:  0 # Running parallel tasks – regular and tablet repair tasks can only run in parallel when regular task uses  --parallel 0  (otherwise the second task fails to start and gets rescheduled)
# hostNetworking is deprecated; node-IP exposure is covered by exposeOptions below.
exposeOptions:
  broadcastOptions:
    clients:
      type: BROADCASTCLIENTSTYPE
    nodes:
      type: BROADCASTNODESTYPE
  nodeService:
    type: NODESERVICETYPE
#DEV sysctls: # deprecated
#DEV   - fs.aio-max-nr=30000000
#DEV   - fs.nr_open=1073741816
#DEV   - fs.file-max=9223372036854775807
#MDC externalSeeds:
#MDC   - EXTERNAL-SEED-1
#MDC   - EXTERNAL-SEED-2
#MDC   - EXTERNAL-SEED-3
imagePullSecrets: []
datacenter: DATACENTER
racks: # ideally 3 racks are used to match RF
  - name: rack1
    members: MEMBERS
    scyllaConfig: CLUSTERNAME-config                  # scylla.yaml ConfigMap written by deployScylla.bash
    scyllaAgentConfig: CLUSTERNAME-agent-config-secret # agent config Secret written by deployScylla.bash
    storage:
      capacity: CAPACITY
      storageClassName: scylladb-local-xfs
    resources:
      requests: { cpu: CPULIMIT, memory: MEMORYLIMIT }
      limits:   { cpu: CPULIMIT, memory: MEMORYLIMIT }
    agentResources:      # For ScyllaDB Agent container
      requests: { cpu: "100m", memory: "100Mi" }
      limits:   { cpu: "100m", memory: "100Mi" } 
    placement:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: scylla.scylladb.com/node-type
                  operator: In
                  values:
                    - NODESELECTOR
                #CLOUD - key: TOPOLOGYKEY
                #CLOUD   operator: In
                #CLOUD   values:
                #CLOUD   - ZONE1
      #PROD podAntiAffinity: 
      #PROD   preferredDuringSchedulingIgnoredDuringExecution:
      #PROD     - weight: 100
      #PROD       podAffinityTerm:
      #PROD         labelSelector:
      #PROD           matchLabels:
      #PROD             app: scylla
      #PROD         matchLabelKeys:
      #PROD           - scylla/datacenter
      #PROD         topologyKey: kubernetes.io/hostname
      tolerations:
        - effect: NoSchedule
          key: scylla-operator.scylladb.com/dedicated
          operator: Equal
          value: scyllaclusters
    #CTorG volumes:
    #CUSTC   - name: CLUSTERNAME-server-certs
    #CUSTC     secret:
    #CUSTC       secretName: CLUSTERNAME-server-certs
    #CUSTC       defaultMode: 420
    #CERTS   - name: scylladb-serving-ca
    #CERTS     configMap:
    #CERTS       name: CLUSTERNAME-local-serving-ca
    #CERTS       defaultMode: 420
    #EAR   - name: CLUSTERNAME-encryption-key
    #EAR     secret:
    #EAR       secretName: CLUSTERNAME-encryption-key
    #EAR       defaultMode: 420
    #GCS   - name: gcs-service-account
    #GCS     secret:
    #GCS       secretName: gcs-service-account
    #CTorG volumeMounts:
    #CUSTC   - name: CLUSTERNAME-server-certs
    #CUSTC     readOnly: true
    #CUSTC     mountPath: /var/run/secrets/scylla-server-certs/
    #CERTS   - name: scylladb-serving-ca
    #CERTS     readOnly: true
    #CERTS     mountPath: /var/run/configmaps/scylla-operator.scylladb.com/scylladb/serving-ca
    #EAR   - name: CLUSTERNAME-encryption-key
    #EAR     readOnly: true
    #EAR     mountPath: /etc/scylla/encryption_keys
    #GCS agentVolumeMounts:
    #GCS   - name: gcs-service-account
    #GCS     mountPath: /etc/scylla-manager-agent/gcs-service-account.json
    #GCS     subPath: gcs-service-account.json
    #GCS     readOnly: true
  - name: rack2
    members: MEMBERS
    scyllaConfig: CLUSTERNAME-config                  # scylla.yaml ConfigMap written by deployScylla.bash
    scyllaAgentConfig: CLUSTERNAME-agent-config-secret # agent config Secret written by deployScylla.bash
    storage:
